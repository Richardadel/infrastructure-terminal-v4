<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc">
  <title id="title">Identity administration and conceptual authentication workflow</title>
  <desc id="desc">Active Directory, Entra ID, and identity operations are shown as separate areas of experience. A separate illustrative access request passes through identity validation, MFA, and an access decision; it does not depict directory synchronization.</desc>
  <style>@media (prefers-reduced-motion: reduce) {.motion { display: none; }}</style>
  <rect width="800" height="640" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2">
    <rect x="40" y="42" width="720" height="112" rx="14"/>
    <rect x="40" y="170" width="720" height="112" rx="14"/>
    <rect x="40" y="298" width="720" height="112" rx="14"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g fill="#00FF88" font-size="26" font-weight="700"><text x="72" y="82">ACTIVE DIRECTORY</text><text x="72" y="210">MICROSOFT ENTRA ID</text><text x="72" y="338">IDENTITY OPERATIONS</text></g>
    <g fill="#F2FFF8" font-size="22"><text x="72" y="120">OUs / Users / Computers / Security Groups</text><text x="72" y="248">MFA / Access / Microsoft 365 Users</text><text x="72" y="376">Lifecycle / Groups / Authentication / M365</text></g>
  </g>
  <text x="400" y="456" text-anchor="middle" fill="#8FA99B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="1">ILLUSTRATIVE ACCESS FLOW · SEPARATE FROM DIRECTORY SYSTEMS</text>

  <path d="M100 520H600M600 520L716 478M600 520L716 562" fill="none" stroke="#1C3B2D" stroke-width="3"/>
  <path d="M100 520H600" fill="none" stroke="#00FF88" stroke-width="2" opacity=".55"/>
  <g fill="#050807" stroke="#00FF88" stroke-width="2">
    <circle cx="100" cy="520" r="12"/><circle cx="270" cy="520" r="12"/>
    <circle cx="440" cy="520" r="12"/><circle cx="600" cy="520" r="12"/>
  </g>
  <g class="motion" fill="none" stroke="#8AFFC1" stroke-width="2">
    <circle r="5" fill="#8AFFC1" stroke="none"><animateMotion dur="7s" repeatCount="indefinite" path="M100 520 H600"/></circle>
    <circle r="5" fill="#00FF88" stroke="none"><animateMotion dur="2.2s" begin="5.6s" repeatCount="indefinite" path="M600 520 L716 478"/></circle>
    <circle r="5" fill="#FFBD2E" stroke="none"><animateMotion dur="2.2s" begin="5.6s" repeatCount="indefinite" path="M600 520 L716 562"/></circle>
    <circle cx="100" cy="520" r="17"><animate attributeName="r" values="12;18;12" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="520" r="17"><animate attributeName="r" values="12;18;12" dur="7s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="520" r="17"><animate attributeName="r" values="12;18;12" dur="7s" begin="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="520" r="17"><animate attributeName="r" values="12;18;12" dur="7s" begin="5.1s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="17">
    <text x="100" y="562" fill="#F2FFF8">REQUEST</text><text x="270" y="562" fill="#F2FFF8">VALIDATE</text>
    <text x="440" y="562" fill="#F2FFF8">MFA</text><text x="600" y="562" fill="#F2FFF8">DECIDE</text>
    <text x="716" y="474" fill="#8AFFC1">ALLOW</text><text x="716" y="594" fill="#FFBD2E">DENY</text>
  </g>
  <g fill="none" stroke="#8AFFC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m702 478 7 7 14-16"/></g>
  <path d="M706 556v-6a8 8 0 0 1 16 0v6m-20 0h24v20h-24z" fill="none" stroke="#FFBD2E" stroke-width="2"/>
</svg>
