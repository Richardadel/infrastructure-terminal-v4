<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Richard Fathalla — IT Infrastructure and Systems Engineering</title>
  <desc id="desc">Cinematic simulated engineering console with layered binary rain, a typing command sequence, a radar sweep, and packet paths between conceptual technical domains. It has no live system access.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030504"/><stop offset="1" stop-color="#0B1410"/></linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00FF88" stop-opacity="0"/><stop offset=".5" stop-color="#00FF88" stop-opacity=".8"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/></linearGradient>
    <radialGradient id="radarGlow"><stop stop-color="#39FF14" stop-opacity=".12"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00FF88" stroke-opacity=".045"/></pattern>
    <clipPath id="rainWindow"><rect x="690" y="82" width="710" height="480" rx="14"/></clipPath>
    <clipPath id="cmd1"><rect x="104" y="389" width="0" height="24"><animate attributeName="width" values="0;220;220;0" keyTimes="0;.18;.74;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cmd2"><rect x="104" y="416" width="0" height="24"><animate attributeName="width" values="0;290;290;0" keyTimes="0;.18;.74;1" dur="12s" begin="1.5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cmd3"><rect x="104" y="443" width="0" height="24"><animate attributeName="width" values="0;230;230;0" keyTimes="0;.18;.74;1" dur="12s" begin="3s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cmd4"><rect x="104" y="470" width="0" height="24"><animate attributeName="width" values="0;300;300;0" keyTimes="0;.18;.74;1" dur="12s" begin="4.5s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .commands { clip-path: none; }
      #cmd1 rect, #cmd2 rect, #cmd3 rect, #cmd4 rect { display: none; }
    }
  </style>
  <rect width="1440" height="620" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="618" rx="19" fill="none" stroke="#1C3B2D" stroke-width="2"/>
  <rect x="20" y="20" width="1400" height="580" rx="14" fill="url(#grid)"/>
  <path d="M40 78H1400" stroke="#1C3B2D"/>
  <path d="M40 79H1400" stroke="url(#headerGlow)" stroke-width="2" opacity=".65"/>

  <g clip-path="url(#rainWindow)" fill="#39FF14" font-family="ui-monospace, Consolas, monospace" font-size="18">
    <g class="motion" opacity=".14">
      <text x="724" y="-120">0<tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">0</tspan><tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">0</tspan><tspan x="724" dy="26">0</tspan><tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">0</tspan><tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">0</tspan><tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">1</tspan><tspan x="724" dy="26">0</tspan><tspan x="724" dy="26">0</tspan>
        <animate attributeName="y" from="-120" to="620" dur="15s" repeatCount="indefinite"/>
      </text>
    </g>
    <g class="motion" opacity=".11">
      <text x="770" y="-300">1<tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">1</tspan><tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">1</tspan><tspan x="770" dy="26">1</tspan><tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">1</tspan><tspan x="770" dy="26">1</tspan><tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">1</tspan><tspan x="770" dy="26">0</tspan><tspan x="770" dy="26">1</tspan>
