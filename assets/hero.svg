    <g><path d="M-22 0H0" stroke-width="3"/><circle r="4" fill="#39FF14"/><animateMotion dur="9.5s" begin="2s" repeatCount="indefinite" path="M1195 234C1170 234 1180 172 1154 172H978C952 172 950 234 926 234" rotate="auto"/></g>
    <g><path d="M-20 0H0" stroke-width="3"/><circle r="4" fill="#8AFFC1"/><animateMotion dur="7s" begin="1s" repeatCount="indefinite" path="M843 266V332H968V375H1051H1110" rotate="auto"/></g>
    <g><path d="M-20 0H0" stroke-width="3"/><circle r="4" fill="#00FF88"/><animateMotion dur="8s" begin="4s" repeatCount="indefinite" path="M1110 406H1051H968V375H843V266" rotate="auto"/></g>
  </g>
  <g fill="#0B1510" stroke="#1C3B2D" stroke-width="2">
    <rect x="760" y="202" width="166" height="64" rx="10"/><rect x="978" y="140" width="176" height="64" rx="10"/>
    <rect x="1195" y="202" width="166" height="64" rx="10"/><rect x="885" y="375" width="166" height="64" rx="10"/>
    <rect x="1110" y="375" width="210" height="64" rx="10"/>
  </g>
