  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="56" cy="48" r="5" fill="#39FF14"/>
    <text x="72" y="54" fill="#8AFFC1" font-size="17" letter-spacing="3">INFRASTRUCTURE TERMINAL / V4</text>
    <text x="1390" y="54" text-anchor="end" fill="#6F897C" font-size="15" letter-spacing="2">SIMULATION MODE</text>
    <text x="72" y="132" fill="#8AFFC1" font-size="21" letter-spacing="4">&gt; ENGINEERING.IDENTITY</text>
    <text x="72" y="205" fill="#F2FFF8" font-size="62" font-weight="800" letter-spacing="1">RICHARD FATHALLA</text>
    <text x="72" y="244" fill="#00FF88" font-size="27" font-weight="700" letter-spacing="1">IT INFRASTRUCTURE</text>
    <text x="72" y="273" fill="#00FF88" font-size="27" font-weight="700" letter-spacing="1">SYSTEMS ENGINEERING</text>
    <text x="72" y="302" fill="#00FF88" font-size="27" font-weight="700" letter-spacing="1">CLOUD TECHNOLOGIES</text>
    <text x="72" y="330" fill="#B7CFC2" font-size="16" letter-spacing="1.5">IDENTITY / ENDPOINTS / CLOUD / NETWORKS / OPERATIONS</text>

    <rect x="72" y="354" width="560" height="202" rx="12" fill="#070D0B" fill-opacity=".92" stroke="#1C3B2D" stroke-width="2"/>
    <path d="M72 390H632" stroke="#1C3B2D"/>
    <circle cx="98" cy="374" r="5" fill="#FF5F56"/><circle cx="116" cy="374" r="5" fill="#FFBD2E"/><circle cx="134" cy="374" r="5" fill="#39FF14"/>
    <text x="154" y="380" fill="#8FA99B" font-size="14" letter-spacing="2">SIMULATED OPERATIONS CONSOLE</text>
    <text x="600" y="380" text-anchor="end" fill="#39FF14" font-size="14">LOCAL ARTIFACT</text>
    <g fill="#B7CFC2" font-family="ui-monospace, Consolas, monospace" font-size="19">
      <text class="commands" x="104" y="408" clip-path="url(#cmd1)">&gt; system.status</text>
      <text class="commands" x="104" y="435" clip-path="url(#cmd2)">&gt; network.interfaces</text>
      <text class="commands" x="104" y="462" clip-path="url(#cmd3)">&gt; identity.check</text>
      <text class="commands" x="104" y="489" clip-path="url(#cmd4)">&gt; endpoint.inventory</text>
    </g>
    <rect class="motion" x="286" y="393" width="9" height="18" fill="#39FF14"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <text x="104" y="530" fill="#6F897C" font-size="13" letter-spacing="2">ILLUSTRATIVE COMMANDS · NO LIVE NETWORK ACCESS</text>
  </g>

  <rect x="690" y="88" width="710" height="468" rx="16" fill="#050807" fill-opacity=".72" stroke="#1C3B2D" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="724" y="122" fill="#8AFFC1" font-size="17" letter-spacing="3">ENGINEERING DOMAIN MAP</text>
    <text x="1366" y="122" text-anchor="end" fill="#6F897C" font-size="13" letter-spacing="2">MODEL ONLY / NO DEPLOYED TOPOLOGY</text>
  </g>
