    <clipPath id="commandFour"><rect x="72" y="416" width="0" height="26"><animate attributeName="width" values="0;300;300;0" keyTimes="0;.18;.72;1" dur="10s" begin="4.8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
