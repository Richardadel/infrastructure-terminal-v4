    <text x="843" y="241">IDENTITY</text><text x="1066" y="179">ENDPOINTS</text><text x="1278" y="241">CLOUD / M365</text>
    <text x="968" y="413">NETWORKS</text><text x="1215" y="413">OPERATIONS</text>
  </g>
  <path d="M42 585H1398" stroke="url(#headerGlow)" stroke-width="2" opacity=".55"/>
  <text x="72" y="606" fill="#6F897C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2">V4 MOTION STUDY / SYMBOLIC SIGNALS ONLY / NO LIVE TELEMETRY</text>
