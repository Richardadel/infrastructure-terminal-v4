    <circle cx="885" cy="406" r="8"/><circle cx="1110" cy="406" r="8"/>
  </g>
  <g class="motion" fill="#39FF14">
    <circle cx="760" cy="234" r="8"><animate attributeName="r" values="7;11;7" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="978" cy="172" r="8"><animate attributeName="r" values="7;11;7" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1195" cy="234" r="8"><animate attributeName="r" values="7;11;7" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="885" cy="406" r="8"><animate attributeName="r" values="7;11;7" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="406" r="8"><animate attributeName="r" values="7;11;7" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
