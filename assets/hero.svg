        <animate attributeName="y" from="-150" to="610" dur="18s" begin="2s" repeatCount="indefinite"/>
      </text>
    </g>
    <g class="motion" opacity=".09">
      <text x="1340" y="-360">1<tspan x="1340" dy="26">1</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">1</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">1</tspan><tspan x="1340" dy="26">1</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">1</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">1</tspan><tspan x="1340" dy="26">0</tspan><tspan x="1340" dy="26">1</tspan>
        <animate attributeName="y" from="-360" to="640" dur="18s" begin="7s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <circle cx="1090" cy="320" r="220" fill="url(#radarGlow)"/>
  <g class="motion" fill="none" stroke="#00FF88" opacity=".12">
