<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Richard Fathalla — IT Infrastructure, Systems Engineering, and Cloud Technologies</title>
  <desc id="desc">Terminal-inspired engineering hero with subtle binary rain, a simulated command sequence, a radar sweep, and moving signals on a conceptual infrastructure topology. No live system access is shown.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050807"/><stop offset="1" stop-color="#0B1110"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00FF88" stop-opacity="0"/><stop offset=".5" stop-color="#00FF88" stop-opacity=".85"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lighting">
      <stop stop-color="#00FF88" stop-opacity=".14"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00FF88" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="rainClip"><rect x="720" y="82" width="690" height="396" rx="8"/></clipPath>
    <clipPath id="commandOne"><rect x="72" y="338" width="0" height="26"><animate attributeName="width" values="0;260;260;0" keyTimes="0;.18;.72;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
