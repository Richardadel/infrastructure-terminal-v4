<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1060" viewBox="0 0 800 1060" role="img" aria-labelledby="title desc">
  <title id="title">Verified GitHub projects</title>
  <desc id="desc">Three verified projects: a PHP and MySQL gym application, a yoga relational database, and a cybersecurity incident dataset. The yoga schema shows only relationships present in the SQL source; the cybersecurity visualization is schematic and presents no numerical results.</desc>
