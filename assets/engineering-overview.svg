<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Engineering experience at a glance</title>
  <desc id="desc">The experience figures are static profile facts. Animated signal traces are illustrative and are not live telemetry.</desc>
  <style>@media (prefers-reduced-motion: reduce) {.motion { display: none; }}</style>
  <rect width="800" height="420" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2"><rect x="40" y="40" width="340" height="150" rx="12"/><rect x="420" y="40" width="340" height="150" rx="12"/><rect x="40" y="230" width="340" height="150" rx="12"/><rect x="420" y="230" width="340" height="150" rx="12"/></g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="210" y="110" fill="#00FF88" font-size="52" font-weight="800">05+</text><text x="590" y="110" fill="#F2FFF8" font-size="52" font-weight="800">250+</text>
    <text x="210" y="292" fill="#00FF88" font-size="28" font-weight="700">HYBRID IDENTITY</text><text x="590" y="292" fill="#F2FFF8" font-size="28" font-weight="700">MULTI-PLATFORM</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#A9BFB3" font-size="20"><text x="210" y="156">YEARS OF IT EXPERIENCE</text><text x="590" y="156">USERS SUPPORTED</text><text x="210" y="338">AD DS / ENTRA ID</text><text x="590" y="338">WINDOWS / macOS</text></g>
  <g class="motion" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round">
    <path d="M300 156h13l8-18 12 28 12-36 13 26h12" stroke-dasharray="112" stroke-dashoffset="112"><animate attributeName="stroke-dashoffset" values="112;0;0;112" keyTimes="0;.28;.72;1" dur="7s" repeatCount="indefinite"/></path>
    <path d="M680 156h12l8-16 12 27 11-32 12 21h14" stroke-dasharray="106" stroke-dashoffset="106"><animate attributeName="stroke-dashoffset" values="106;0;0;106" keyTimes="0;.28;.72;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></path>
    <path d="M300 356h12l8-14 12 26 12-33 12 21h13" stroke-dasharray="98" stroke-dashoffset="98"><animate attributeName="stroke-dashoffset" values="98;0;0;98" keyTimes="0;.28;.72;1" dur="7s" begin="3s" repeatCount="indefinite"/></path>
    <path d="M680 356h12l8-18 12 28 12-34 12 23h12" stroke-dasharray="102" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" values="102;0;0;102" keyTimes="0;.28;.72;1" dur="7s" begin="4.5s" repeatCount="indefinite"/></path>
  </g>
</svg>
