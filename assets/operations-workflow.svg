<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title">
  <title id="title">Enterprise operations workflow</title>
  <style>@media (prefers-reduced-motion: reduce) {.motion { display: none; }}</style>
  <rect width="800" height="700" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2"><rect x="40" y="50" width="720" height="90" rx="12"/><rect x="40" y="160" width="720" height="90" rx="12"/><rect x="40" y="270" width="720" height="90" rx="12"/><rect x="40" y="380" width="720" height="90" rx="12"/><rect x="40" y="490" width="720" height="90" rx="12"/></g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#F2FFF8">
    <g fill="#00FF88" font-size="26" font-weight="700"><text x="72" y="86">01  DETECT</text><text x="72" y="196">02  DIAGNOSE</text><text x="72" y="306">03  REMEDIATE</text><text x="72" y="416">04  VERIFY</text><text x="72" y="526">05  DOCUMENT</text></g>
    <g font-size="20"><text x="72" y="122">Incident / service request</text><text x="72" y="232">Troubleshoot / technical diagnosis</text><text x="72" y="342">Technical action / escalation</text><text x="72" y="452">Confirm service recovery</text><text x="72" y="562">Ticket / SOP / knowledge base</text></g>
  </g>
  <path d="M720 95V535" fill="none" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#050807" stroke="#00FF88" stroke-width="2"><circle cx="720" cy="95" r="7"/><circle cx="720" cy="205" r="7"/><circle cx="720" cy="315" r="7"/><circle cx="720" cy="425" r="7"/><circle cx="720" cy="535" r="7"/></g>
  <g class="motion">
    <circle r="5" fill="#FFBD2E"><animateMotion dur="10s" repeatCount="indefinite" path="M720 95V315"/></circle>
    <circle r="4" fill="#8AFFC1"><animateMotion dur="10s" begin="10s" repeatCount="indefinite" path="M720 315V535"/></circle>
  </g>
  <g class="motion" fill="none" stroke="#8AFFC1" stroke-width="2">
    <circle cx="720" cy="95" r="9"><animate attributeName="r" values="7;13;7" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="205" r="9"><animate attributeName="r" values="7;13;7" dur="10s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="315" r="9"><animate attributeName="r" values="7;13;7" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="425" r="9"><animate attributeName="r" values="7;13;7" dur="10s" begin="6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="535" r="9"><animate attributeName="r" values="7;13;7" dur="10s" begin="8s" repeatCount="indefinite"/></circle>
  </g>
  <path class="motion" d="m709 425 7 7 15-17" fill="none" stroke="#8AFFC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="30">
    <animate attributeName="stroke-dashoffset" values="30;0;0;30" keyTimes="0;.2;.75;1" dur="10s" begin="6s" repeatCount="indefinite"/>
  </path>
</svg>
