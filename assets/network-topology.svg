<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic conceptual network packet-flow visualization</title>
  <desc id="desc">A simulated wired and wireless Layer 1/2 path from endpoints through patching and an access switch. Packets, acknowledgements, port activity, and one illustrative retry are animation only; this is not a deployed network and shows no live traffic or metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030504"/><stop offset="1" stop-color="#0B1410"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00FF88" stop-opacity="0"/><stop offset=".5" stop-color="#39FF14" stop-opacity=".85"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00FF88" stroke-opacity=".04"/></pattern>
    <clipPath id="rain"><rect x="44" y="106" width="1352" height="744" rx="16"/></clipPath>
  </defs>
  <style>@media (prefers-reduced-motion: reduce) {.motion { display: none; }}</style>
  <rect width="1440" height="900" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1438" height="898" rx="21" fill="none" stroke="#1C3B2D" stroke-width="2"/>
  <rect x="20" y="20" width="1400" height="860" rx="16" fill="url(#grid)"/>
  <g clip-path="url(#rain)" fill="#39FF14" font-family="ui-monospace, Consolas, monospace" font-size="16">
    <g class="motion" opacity=".055">
      <text x="370" y="-180">0<tspan x="370" dy="24">1</tspan><tspan x="370" dy="24">1</tspan><tspan x="370" dy="24">0</tspan><tspan x="370" dy="24">1</tspan><tspan x="370" dy="24">0</tspan><tspan x="370" dy="24">0</tspan><tspan x="370" dy="24">1</tspan><tspan x="370" dy="24">0</tspan><tspan x="370" dy="24">1</tspan><tspan x="370" dy="24">1</tspan><tspan x="370" dy="24">0</tspan><tspan x="370" dy="24">0</tspan>
        <animate attributeName="y" from="-180" to="850" dur="19s" repeatCount="indefinite"/>
      </text>
      <text x="1370" y="-420">1<tspan x="1370" dy="24">0</tspan><tspan x="1370" dy="24">0</tspan><tspan x="1370" dy="24">1</tspan><tspan x="1370" dy="24">1</tspan><tspan x="1370" dy="24">0</tspan><tspan x="1370" dy="24">1</tspan><tspan x="1370" dy="24">0</tspan><tspan x="1370" dy="24">0</tspan><tspan x="1370" dy="24">1</tspan><tspan x="1370" dy="24">0</tspan><tspan x="1370" dy="24">1</tspan><tspan x="1370" dy="24">1</tspan>
        <animate attributeName="y" from="-420" to="800" dur="23s" begin="4s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <path d="M260 314H390L450 254H640C694 254 698 355 740 355H1040H1130" fill="none" stroke="#17432E" stroke-width="4"/>
  <path d="M260 314H390L450 254H640C694 254 698 355 740 355H1040H1130" fill="none" stroke="#00FF88" stroke-width="1" stroke-dasharray="3 15" opacity=".6"/>
  <path d="M260 510H390C430 510 430 522 470 522H640C692 522 704 420 740 420H1040C1080 420 1080 355 1130 355" fill="none" stroke="#17432E" stroke-width="4"/>
  <path d="M1130 355H1040C1080 355 1080 420 1040 420H740C704 420 692 522 640 522H470C430 522 430 510 390 510H260" fill="none" stroke="#1A4933" stroke-width="2" stroke-dasharray="2 13" opacity=".55"/>

  <g class="motion" fill="none" stroke="#8AFFC1" stroke-width="2">
    <g><path d="M-34 0H0" stroke-width="4"/><rect x="-7" y="-4" width="8" height="8" rx="2" fill="#39FF14"/><animateMotion dur="7.5s" repeatCount="indefinite" path="M260 314H390L450 254H640C694 254 698 355 740 355H1040H1130" rotate="auto"/></g>
    <g><path d="M-28 0H0" stroke-width="3"/><rect x="-6" y="-3" width="7" height="6" rx="1" fill="#8AFFC1"/><animateMotion dur="8s" begin="1.8s" repeatCount="indefinite" path="M1130 355H1040H740C698 355 694 254 640 254H450L390 314H260" rotate="auto"/></g>
    <g><path d="M-30 0H0" stroke-width="3"/><rect x="-6" y="-3" width="7" height="6" rx="1" fill="#8AFFC1"/><animateMotion dur="8.5s" begin="2.5s" repeatCount="indefinite" path="M260 510H390C430 510 430 522 470 522H640C692 522 704 420 740 420H1040C1080 420 1080 355 1130 355" rotate="auto"/></g>
    <g><path d="M-24 0H0" stroke-width="3"/><rect x="-5" y="-3" width="6" height="6" rx="1" fill="#00FF88"/><animateMotion dur="9s" begin="4s" repeatCount="indefinite" path="M1130 355H1040C1080 355 1080 420 1040 420H740C704 420 692 522 640 522H470C430 522 430 510 390 510H260" rotate="auto"/></g>
  </g>

  <g fill="#07100C" stroke="#1C3B2D" stroke-width="2">
    <rect x="70" y="234" width="190" height="160" rx="14"/>
    <rect x="390" y="190" width="250" height="128" rx="14"/>
    <rect x="390" y="446" width="250" height="128" rx="14"/>
    <rect x="740" y="280" width="300" height="220" rx="16"/>
    <rect x="1130" y="244" width="240" height="220" rx="16"/>
  </g>
  <g fill="none" stroke="#00FF88" stroke-width="2">
    <rect x="118" y="262" width="92" height="52" rx="5"/><path d="M108 322h112l-10 9h-92z"/><path d="M148 331v8m30-8v8"/>
    <path d="M458 226h112v40H458zM468 236h8m12 0h8m12 0h8m12 0h8m12 0h8m12 0h8"/>
    <path d="M540 496c0-12 15-22 34-22s34 10 34 22m-54 0v24m40-24v24m-48 0h56m-44 0v9m32-9v9"/>
    <rect x="786" y="348" width="208" height="98" rx="8"/>
    <path d="M802 376h176M802 396h176M802 416h176"/>
    <path d="M1140 296h220v146h-220zM1160 310h180v34h-180zM1160 354h180v34h-180zM1160 398h180v28h-180z"/>
  </g>
  <g fill="#050807" stroke="#8AFFC1" stroke-width="2">
    <circle cx="810" cy="376" r="5"/><circle cx="842" cy="376" r="5"/><circle cx="874" cy="376" r="5"/><circle cx="906" cy="376" r="5"/>
    <circle cx="938" cy="376" r="5"/><circle cx="970" cy="376" r="5"/>
    <circle cx="810" cy="416" r="5"/><circle cx="842" cy="416" r="5"/><circle cx="874" cy="416" r="5"/><circle cx="906" cy="416" r="5"/>
    <circle cx="938" cy="416" r="5"/><circle cx="970" cy="416" r="5"/>
  </g>
  <g class="motion" fill="#39FF14">
    <circle cx="810" cy="376" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="874" cy="376" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="4s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="938" cy="376" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="842" cy="416" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="416" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="4s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="416" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
  </g>
  <g class="motion" fill="#FFBD2E" opacity=".8"><circle r="5"><animateMotion dur="3s" begin="9s" repeatCount="indefinite" path="M980 420C1030 390 1030 450 980 420"/></circle></g>
  <g class="motion" fill="none" stroke="#39FF14" opacity=".4">
    <circle cx="1250" cy="146" r="62"/><circle cx="1250" cy="146" r="38"/>
    <path d="M1250 146V84M1188 146H1312"/>
    <path d="M1250 146V84" stroke-width="3"/>
    <animateTransform attributeName="transform" type="rotate" from="0 1250 146" to="360 1250 146" dur="20s" repeatCount="indefinite"/>
  </g>
  <g fill="#8AFFC1" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="64" font-size="20" letter-spacing="3">NETWORK SIGNAL LAB / V4</text>
    <text x="1368" y="64" text-anchor="end" fill="#6F897C" font-size="17" letter-spacing="2">SIMULATED / NO LIVE TRAFFIC</text>
    <text x="72" y="142" fill="#F2FFF8" font-size="40" font-weight="700">PACKET PATH / LAYER 1–2</text>
    <text x="72" y="174" fill="#8FA99B" font-size="20">Wired and wireless routes through patching and access switching</text>
    <text x="84" y="366" font-size="22" font-weight="700">WIRED ENDPOINT</text>
    <text x="84" y="384" fill="#A9BFB3" font-size="18">Request / response</text>
    <text x="414" y="214" font-size="22" font-weight="700">PATCH PANEL</text>
    <text x="414" y="294" fill="#A9BFB3" font-size="18">Physical path / port check</text>
    <text x="414" y="470" font-size="22" font-weight="700">WIRELESS AP</text>
    <text x="414" y="558" fill="#A9BFB3" font-size="18">Client connectivity path</text>
    <text x="768" y="326" font-size="24" font-weight="700">ACCESS SWITCH</text>
    <text x="768" y="344" fill="#A9BFB3" font-size="17" letter-spacing="2">ILLUSTRATIVE PORT MAP</text>
    <text x="1148" y="278" font-size="22" font-weight="700">NETWORK HANDOFF</text>
    <text x="1148" y="462" fill="#A9BFB3" font-size="18">Conceptual uplink path</text>
  </g>
  <g fill="#07100C" stroke="#1C3B2D" stroke-width="2">
    <rect x="70" y="640" width="1300" height="190" rx="16"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="104" y="684" fill="#8AFFC1" font-size="20" letter-spacing="3">DIAGNOSTIC SEQUENCE</text>
    <text x="1335" y="684" text-anchor="end" fill="#6F897C" font-size="17" letter-spacing="2">CONCEPTUAL WORKFLOW / NO DEPLOYED NETWORK</text>
    <path d="M160 742H1260" fill="none" stroke="#1C3B2D" stroke-width="3"/>
    <path d="M160 742H1260" fill="none" stroke="url(#signal)" stroke-width="3" stroke-dasharray="40 960">
      <animate class="motion" attributeName="stroke-dashoffset" values="1000;0" dur="7s" repeatCount="indefinite"/>
    </path>
    <g fill="#050807" stroke="#00FF88" stroke-width="2"><circle cx="160" cy="742" r="11"/><circle cx="430" cy="742" r="11"/><circle cx="700" cy="742" r="11"/><circle cx="970" cy="742" r="11"/><circle cx="1260" cy="742" r="11"/></g>
    <g fill="#F2FFF8" font-size="20" text-anchor="middle"><text x="160" y="786">LINK</text><text x="430" y="786">CABLE</text><text x="700" y="786">SWITCH PORT</text><text x="970" y="786">WIRELESS</text><text x="1260" y="786">ESCALATE / DOCUMENT</text></g>
  </g>
  <text x="720" y="866" text-anchor="middle" fill="#6F897C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">PACKET MOTION, PORT LIGHTS, AND RETRY ARE SIMULATED FOR VISUALIZATION</text>
</svg>
