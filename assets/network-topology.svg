<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title">
  <title id="title">Network infrastructure topology</title>
  <style>@media (prefers-reduced-motion: reduce) {.motion { display: none; }}</style>
  <rect width="800" height="620" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="none" stroke="#00FF88" stroke-width="2" opacity=".75">
    <path d="M700 160V260M700 260V360M700 360V460"/>
    <circle cx="700" cy="260" r="8" fill="#050807"><animate class="motion" attributeName="r" values="7;10;7" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="360" r="8" fill="#050807"><animate class="motion" attributeName="r" values="7;10;7" dur="5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="460" r="8" fill="#050807"><animate class="motion" attributeName="r" values="7;10;7" dur="5s" begin="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2"><rect x="40" y="54" width="720" height="106" rx="12"/><rect x="40" y="180" width="720" height="106" rx="12"/><rect x="40" y="306" width="720" height="106" rx="12"/><rect x="40" y="432" width="720" height="106" rx="12"/></g>
  <g class="motion" fill="none" stroke="#8AFFC1" stroke-width="2" opacity=".9">
    <g><path d="M0 -20V-5" stroke-width="4"/><circle r="5" fill="#8AFFC1"/><animateMotion dur="6.5s" repeatCount="indefinite" path="M700 160 V538"/></g>
    <g><path d="M0 5V20" stroke-width="3"/><circle r="4" fill="#00FF88"/><animateMotion dur="7.5s" begin="1.4s" repeatCount="indefinite" path="M700 538 V160"/></g>
    <g><path d="M0 -16V-4" stroke-width="3"/><circle r="4" fill="#8AFFC1"/><animateMotion dur="4.8s" begin="3s" repeatCount="indefinite" path="M700 204 V416"/></g>
  </g>
  <g class="motion" fill="#00FF88">
    <circle cx="680" cy="86" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="703" cy="86" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="726" cy="86" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="212" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
  </g>
  <g class="motion" fill="#FFBD2E" opacity=".9">
    <circle r="4"><animateMotion dur="3s" begin="8s" repeatCount="indefinite" path="M700 360 C748 338 748 382 700 360"/></circle>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#F2FFF8">
    <g fill="#00FF88" font-size="26" font-weight="700"><text x="72" y="92">NETWORK CORE</text><text x="72" y="218">DISTRIBUTION</text><text x="72" y="344">PATCH / CABLING</text><text x="72" y="470">WIRELESS / ACCESS</text></g>
    <g font-size="22"><text x="72" y="128">Switch connectivity / network diagnostics</text><text x="72" y="254">Patch panels / switch ports</text><text x="72" y="380">Rack support / cabling / data room</text><text x="72" y="506">Wireless access points / endpoints</text></g>
  </g>
  <text x="400" y="590" text-anchor="middle" fill="#8FA99B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">ILLUSTRATIVE PACKET PATHS · NO LIVE TRAFFIC OR METRICS</text>
</svg>
